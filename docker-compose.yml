services:
  db:
    image: postgres:18-alpine
    container_name: nevermind-db
    environment:
      POSTGRES_USER: resources
      POSTGRES_PASSWORD: resources
      POSTGRES_DB: resources_iiith
    ports:
      - "5433:5432"
    volumes:
      # postgres:18 changed the layout: the mount goes at /var/lib/postgresql and
      # the server puts its data in a version-numbered subdirectory. Mounting
      # /var/lib/postgresql/data (the pre-18 convention) makes the container exit.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resources -d resources_iiith"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db-data:
